##### Prefix #####
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### Vim-style pane movement #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### Split panes (Vim-like) #####
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### Reload config #####
bind r source-file ~/.tmux.conf \; display "Reloaded!"

##### Enable mouse (scroll, resize, select panes) #####
set -g mouse on

##### Scrollback history #####
set -g history-limit 100000

##### Vim-style copy mode #####
setw -g mode-keys vi

# Start selection with v (like Vim)
bind-key -T copy-mode-vi v send -X begin-selection

# Yank with y
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

##### Better colors #####
set -g default-terminal "tmux-256color"
set -g focus-events on
set -ga terminal-overrides ",*:Tc"

##### Start pane numbering at 1 #####
set -g base-index 1
setw -g pane-base-index 1

##### Session persistence #####

# TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'

# Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Relaunch these on restore
set -g @resurrect-processes 'flyctl "claude->claude -c"'

# Autosave stays on as a crash safety net;
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

set -g extended-keys on
set -g extended-keys-format csi-u
